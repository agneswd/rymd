name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  # Nothing in CI may reach out to GitHub Releases.
  RYMD_NO_UPDATE_CHECK: "1"

jobs:
  # Both platforms build and test, so the platform-specific updater code
  # can never rot behind a cfg that CI does not compile.
  test:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
          - os: windows-latest
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - uses: Swatinem/rust-cache@v2

      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwayland-dev libxkbcommon-dev libxkbcommon-x11-dev \
            libxcb1-dev libxcb-cursor-dev libvulkan-dev libudev-dev \
            cmake clang build-essential

      - name: Format
        if: runner.os == 'Linux'
        run: cargo fmt --all --check

      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings

      - name: Test
        run: cargo test --all-targets

      - name: Benchmark harness builds
        if: runner.os == 'Linux'
        run: cargo build --release --bin rymd-bench

      - name: Windows cross-check of the scanner
        if: runner.os == 'Linux'
        run: |
          rustup target add x86_64-pc-windows-gnu
          cargo check --bins --lib --target x86_64-pc-windows-gnu
