[package]
name = "rymd"
version = "0.2.7"
edition = "2024"
description = "A calm disk usage visualizer for Windows and Linux"

[dependencies]
gpui = { git = "https://github.com/zed-industries/zed" }
gpui-component = { git = "https://github.com/longbridge/gpui-component", rev = "11b02b0e7a9fb51639dd9a28f3ad5aa4f99fdd81" }
gpui-component-assets = { git = "https://github.com/longbridge/gpui-component", rev = "11b02b0e7a9fb51639dd9a28f3ad5aa4f99fdd81" }

anyhow = "1"
blake3 = "1"
chrono = { version = "0.4", default-features = false, features = ["std", "clock"] }
crossbeam-channel = "0.5"
crossbeam-deque = "0.8"
directories = "6"
parking_lot = "0.12"
rayon = "1"
semver = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
smol = "2"
tempfile = "3"
thiserror = "2"
trash = "5"
ureq = { version = "3", default-features = false, features = ["rustls"] }

[patch.crates-io]
gpui = { git = "https://github.com/zed-industries/zed" }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = [
  "Win32_Storage_FileSystem",
  "Win32_Foundation",
  "Win32_Security",
  "Win32_System_IO",
] }

[build-dependencies]
winres = "0.1"

[profile.dev]
debug = "limited"

[profile.dev.package]
resvg = { opt-level = 3 }
rustybuzz = { opt-level = 3 }
taffy = { opt-level = 3 }
ttf-parser = { opt-level = 3 }

[profile.release]
lto = "fat"
codegen-units = 1
